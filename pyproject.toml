[project]
name = "opcua-mcp"
version = "0.1.0"
description = "An MCP server that connects AI agents to OPC UA-enabled industrial systems."
readme = "README.md"
requires-python = ">=3.12.2"
dependencies = [
    "asyncua>=2.0.1",
    "mcp[cli]>=2.2,<3",
    "pydantic-settings>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
